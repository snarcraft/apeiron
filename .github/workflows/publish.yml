name: Publish

on:
  release:
    types: [published]
  # re-enable main-push auto patch publishing when ready:
  # push:
  #   branches:
  #     - main

# releases publish the version they carry. The main-push auto
# bump (patch digit) is parked above — the bump step below is
# ready and waits for the trigger to return.

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # zero dependencies — there is nothing to install and no
      # lockfile for npm ci to consume.

      - name: Bump patch (main pushes only)
        if: github.event_name == 'push'
        run: |
          git config user.name "apeiron-bot"
          git config user.email "actions@github.com"
          node -e '
            const fs = require("fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const [major, minor, patch] = pkg.version.split(".").map(Number)
            pkg.version = [major, minor, patch + 1].join(".")
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            console.log("patch bumped -> " + pkg.version)
          '
          git add package.json
          git commit -qm "chore(release): bump patch [skip ci]"
          git pull --rebase -q origin main
          git push

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
