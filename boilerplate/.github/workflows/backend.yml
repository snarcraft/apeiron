name: Publish backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  REPOSITORY: {{GITHUB_REPOSITORY}}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against previous tag
        id: diff
        run: |
          PREVIOUS=$(git describe --abbrev=0 --tags ${{ github.ref }}^ 2>/dev/null || true)
          if [ -z "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$PREVIOUS".."${{ github.ref }}" -- apps/backend composer.lock .github/workflows/backend.yml | head -1)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        php: [8.4]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole, pdo_pgsql, redis, intl, bcmath

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: apps/backend/vendor
          key: composer-${{ hashFiles('apps/backend/composer.lock') }}

      - name: Extract branch name
        id: branch
        run: |
          NAME="${GITHUB_REF#refs/*/}"
          echo "name=${NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Warm caches
        env:
          TELESCOPE_ENABLED: false
        run: |
          php artisan event:cache
          php artisan vendor:publish --tag=laravel-assets --no-interaction --ansi

      - name: Stage build context
        run: |
          mkdir -p archive/public
          rsync -a public/build archive/public/ 2>/dev/null || true
          rsync -a vendor archive/public/
          mkdir -p archive/server
          rsync -a \
            --exclude 'tests' \
            --exclude 'storage' \
            app bootstrap config database public resources routes vendor artisan composer.json composer.lock \
            archive/server/
          mkdir -p archive/server/storage/framework/{cache/data,sessions,testing,views} archive/server/storage/logs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Publish static assets to CDN
        env:
          ASSET_PATH: ${{ github.sha }}
        run: aws s3 sync archive/public s3://${{ vars.AWS_ASSET_BUCKET }}/$ASSET_PATH --cache-control public,max-age=31536000,immutable --acl public-read

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ../Dockerfile
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ASSET_URL=${{ vars.CDN_URL }}/${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ steps.branch.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Discord
        uses: ./.github/actions/notify-discord
        if: always()
        with:
          service: backend
          sha: ${{ github.sha }}
          branch: ${{ steps.branch.outputs.name }}
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.REPOSITORY }}
          app-name: ${{ vars.APP_NAME }}
          app-env: ${{ github.ref_name == 'main' && 'staging' || 'production' }}
          app-version: ${{ vars.APP_VERSION }}
          discord-webhook-url: ${{ secrets.DISCORD_SERVER_WEBHOOK_URL }}
          discord-user-id: ${{ secrets.DISCORD_USER_ID }}
