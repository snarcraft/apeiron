<svg xmlns="http://www.w3.org/2000/svg" width="880" height="34" viewBox="0 0 880 34" role="img" aria-label="Apeiron badges">
  <defs>
    <linearGradient id="b-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    <!-- stack -->
    <g>
      <rect width="240" height="22" rx="6" fill="url(#b-fill)" stroke="#26224a"/>
      <rect width="46" height="22" rx="6" fill="#988cff" fill-opacity="0.22"/>
      <rect x="40" width="6" height="22" fill="#26224a"/>
      <text x="23" y="15" text-anchor="middle" fill="#c4bcff" font-weight="600">stack</text>
      <text x="143" y="15" text-anchor="middle" fill="#e8e4ff">laravel · nuxt · flutter</text>
    </g>
    <!-- cloud -->
    <g transform="translate(248)">
      <rect width="175" height="22" rx="6" fill="url(#b-fill)" stroke="#26224a"/>
      <rect width="50" height="22" rx="6" fill="#00b4bf" fill-opacity="0.2"/>
      <rect x="44" width="6" height="22" fill="#26224a"/>
      <text x="25" y="15" text-anchor="middle" fill="#a8ecf0" font-weight="600">cloud</text>
      <text x="112" y="15" text-anchor="middle" fill="#e8e4ff">aws · cloudflare</text>
    </g>
    <!-- ship -->
    <g transform="translate(431)">
      <rect width="245" height="22" rx="6" fill="url(#b-fill)" stroke="#26224a"/>
      <rect width="40" height="22" rx="6" fill="#988cff" fill-opacity="0.22"/>
      <rect x="34" width="6" height="22" fill="#26224a"/>
      <text x="20" y="15" text-anchor="middle" fill="#c4bcff" font-weight="600">ship</text>
      <text x="142" y="15" text-anchor="middle" fill="#e8e4ff">swarm · ghcr · app stores</text>
    </g>
    <!-- readers -->
    <g transform="translate(684)">
      <rect width="196" height="22" rx="6" fill="url(#b-fill)" stroke="#26224a"/>
      <rect width="44" height="22" rx="6" fill="#00b4bf" fill-opacity="0.2"/>
      <rect x="38" width="6" height="22" fill="#26224a"/>
      <text x="22" y="15" text-anchor="middle" fill="#a8ecf0" font-weight="600">read</text>
      <text x="120" y="15" text-anchor="middle" fill="#e8e4ff">humans + ai agents</text>
    </g>
  </g>
</svg>
