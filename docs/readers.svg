<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Two readers — human and ai agent — converge on one repo: same conventions, same fixers, byte-identical commits, same green Pest suite">
  <defs>
    <linearGradient id="a-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #e8e4ff; }
      .who { fill: #e8e4ff; font-weight: 600; font-size: 15px; }
      .dim { fill: #9d97c9; font-size: 11px; }
      .lbl { fill: #c4bcff; font-weight: 600; font-size: 10.5px; letter-spacing: .08em; }
      .box { fill: url(#a-fill); stroke: #26224a; }
      .chip { fill: url(#a-fill); stroke: #26224a; }
      .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; }
      .t { stroke: #00b4bf; } .v { stroke: #988cff; }
      .repo { animation: breathe 3.6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      @keyframes breathe { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#a-fill)" stroke="#26224a"/>

  <!-- human -->
  <g>
    <rect x="50" y="120" width="190" height="72" rx="11" class="box" stroke="#00b4bf"/>
    <text x="145" y="149" text-anchor="middle" class="who">human</text>
    <text x="145" y="170" text-anchor="middle" class="dim">make dev · make test</text>
  </g>

  <!-- agent -->
  <g>
    <rect x="960" y="120" width="190" height="72" rx="11" class="box" stroke="#988cff"/>
    <text x="1055" y="149" text-anchor="middle" class="who">ai agent</text>
    <text x="1055" y="170" text-anchor="middle" class="dim">reads AGENTS.md first</text>
  </g>

  <!-- converging paths -->
  <path class="flow t" d="M240,156 C330,156 360,130 420,122"/>
  <path class="flow v" d="M960,156 C870,156 840,130 780,122"/>
  <circle r="3.4" fill="#00b4bf">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M240,156 C330,156 360,130 420,122"/>
  </circle>
  <circle r="3.4" fill="#988cff">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M960,156 C870,156 840,130 780,122"/>
  </circle>

  <!-- the project -->
  <g class="repo">
    <rect x="420" y="42" width="360" height="256" rx="12" class="box" stroke="#988cff"/>
    <text x="600" y="72" text-anchor="middle" class="lbl">ONE REPO · ONE STANDARD</text>
    <g><rect x="446" y="90" width="308" height="38" rx="8" class="chip"/>
      <text x="600" y="114" text-anchor="middle" class="dim">AGENTS.md — the map · ai/conventions — the law</text></g>
    <g><rect x="446" y="136" width="308" height="38" rx="8" class="chip"/>
      <text x="600" y="160" text-anchor="middle" class="dim">ai/playbooks — add-feature · rbac · deploy</text></g>
    <g><rect x="446" y="182" width="308" height="38" rx="8" class="chip"/>
      <text x="600" y="206" text-anchor="middle" class="dim">prettier · php-cs-fixer · dart format</text></g>
    <g><rect x="446" y="228" width="308" height="38" rx="8" class="chip" stroke="#00b4bf"/>
      <text x="600" y="252" text-anchor="middle" class="dim">pest — the shared truth · mcp — live docs</text></g>
  </g>

  <!-- verdict -->
  <path class="flow t" d="M420,218 C360,226 330,250 262,258"/>
  <text x="145" y="252" text-anchor="middle" class="dim">byte-identical commits</text>
  <text x="145" y="270" text-anchor="middle" class="dim">same suite green</text>
</svg>
