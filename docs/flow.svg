<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Apeiron pipeline — one command to a full platform">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0918"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <radialGradient id="f-core" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#cfc6ff"/>
      <stop offset="40%" stop-color="#988cff"/>
      <stop offset="100%" stop-color="#3a2f96"/>
    </radialGradient>
    <radialGradient id="f-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#988cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#988cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#988cff"/>
      <stop offset="100%" stop-color="#00b4bf"/>
    </linearGradient>
    <filter id="f-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#f-bg)"/>

  <!-- ── terminal card ─────────────────────────────────── -->
  <g>
    <rect x="56" y="196" width="264" height="168" rx="14" fill="#0d0c1e" stroke="#26224a"/>
    <circle cx="82" cy="220" r="5" fill="#ff5f57"/>
    <circle cx="100" cy="220" r="5" fill="#febc2e"/>
    <circle cx="118" cy="220" r="5" fill="#28c840"/>
    <text x="140" y="225" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6f6a96">apeiron</text>

    <text x="80" y="258" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#00b4bf">$</text>
    <text x="96" y="258" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e8e4ff">node .</text>
    <rect x="80" y="274" width="8" height="16" fill="#988cff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace, Menlo, monospace" font-size="11">
      <rect x="80" y="304" width="70" height="18" rx="9" fill="#988cff" fill-opacity="0.16" stroke="#988cff" stroke-opacity="0.45"/>
      <text x="115" y="317" text-anchor="middle" fill="#c4bcff">identity</text>
      <rect x="158" y="304" width="60" height="18" rx="9" fill="#988cff" fill-opacity="0.16" stroke="#988cff" stroke-opacity="0.45"/>
      <text x="188" y="317" text-anchor="middle" fill="#c4bcff">rbac</text>
      <rect x="226" y="304" width="66" height="18" rx="9" fill="#00b4bf" fill-opacity="0.16" stroke="#00b4bf" stroke-opacity="0.45"/>
      <text x="259" y="317" text-anchor="middle" fill="#a8ecf0">palette</text>
      <rect x="80" y="330" width="58" height="18" rx="9" fill="#00b4bf" fill-opacity="0.16" stroke="#00b4bf" stroke-opacity="0.45"/>
      <text x="109" y="343" text-anchor="middle" fill="#a8ecf0">soul</text>
      <rect x="146" y="330" width="88" height="18" rx="9" fill="#988cff" fill-opacity="0.16" stroke="#988cff" stroke-opacity="0.45"/>
      <text x="190" y="343" text-anchor="middle" fill="#c4bcff">secrets</text>
    </g>
  </g>

  <!-- ── the source ────────────────────────────────────── -->
  <g transform="translate(480 280)">
    <circle r="120" fill="url(#f-halo)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <ellipse rx="96" ry="34" fill="none" stroke="url(#f-ring)" stroke-opacity="0.5" stroke-width="1.4" transform="rotate(-20)"/>
      <circle cx="96" cy="0" r="6" fill="url(#f-ring)" filter="url(#f-soft)"/>
    </g>
    <circle r="42" fill="#988cff" filter="url(#f-soft)" opacity="0.7"/>
    <circle r="36" fill="url(#f-core)"/>
    <text x="0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#c4bcff">APEIRON</text>
    <text x="0" y="94" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6f6a96">oklch · rbac · souls · i18n</text>
  </g>

  <!-- ── connectors ────────────────────────────────────── -->
  <g fill="none" stroke="#988cff" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="5 7">
    <path d="M320 280 C 380 280, 400 280, 436 280">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="#00b4bf" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 7">
    <path d="M562 252 C 660 190, 690 138, 762 106">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M570 268 C 664 246, 690 224, 762 208">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M572 280 C 660 280, 690 280, 762 310">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M570 294 C 664 318, 690 396, 762 412">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M562 308 C 660 372, 690 498, 762 514">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ── output cards ──────────────────────────────────── -->
  <g font-family="ui-monospace, Menlo, monospace">
    <!-- web -->
    <g transform="translate(762 76)">
      <rect width="382" height="58" rx="12" fill="#0d0c1e" stroke="#26224a"/>
      <rect x="16" y="15" width="28" height="28" rx="7" fill="#988cff" fill-opacity="0.18" stroke="#988cff" stroke-opacity="0.6"/>
      <circle cx="30" cy="26" r="2.4" fill="#988cff"/><circle cx="38" cy="26" r="2.4" fill="#988cff"/><circle cx="30" cy="34" r="2.4" fill="#988cff"/><circle cx="38" cy="34" r="2.4" fill="#988cff"/>
      <text x="60" y="26" font-size="14" fill="#e8e4ff">apps/web</text>
      <text x="60" y="44" font-size="11" fill="#8b87a8">static marketing site · SEO · llms.txt · souls</text>
    </g>
    <!-- frontend -->
    <g transform="translate(762 178)">
      <rect width="382" height="58" rx="12" fill="#0d0c1e" stroke="#26224a"/>
      <rect x="16" y="15" width="28" height="28" rx="7" fill="#00b4bf" fill-opacity="0.16" stroke="#00b4bf" stroke-opacity="0.6"/>
      <rect x="23" y="20" width="14" height="10" rx="2" fill="none" stroke="#00b4bf" stroke-width="1.6"/>
      <path d="M26 34 h8 M30 34 v4" stroke="#00b4bf" stroke-width="1.6" fill="none"/>
      <text x="60" y="26" font-size="14" fill="#e8e4ff">apps/frontend</text>
      <text x="60" y="44" font-size="11" fill="#8b87a8">Nuxt SSR webapp · sanctum · tenant theming</text>
    </g>
    <!-- backend -->
    <g transform="translate(762 280)">
      <rect width="382" height="58" rx="12" fill="#0d0c1e" stroke="#26224a"/>
      <rect x="16" y="15" width="28" height="28" rx="7" fill="#988cff" fill-opacity="0.18" stroke="#988cff" stroke-opacity="0.6"/>
      <ellipse cx="30" cy="22" rx="9" ry="3.6" fill="none" stroke="#988cff" stroke-width="1.6"/>
      <path d="M21 22 v10 a9 3.6 0 0 0 18 0 v-10" fill="none" stroke="#988cff" stroke-width="1.6"/>
      <text x="60" y="26" font-size="14" fill="#e8e4ff">apps/backend</text>
      <text x="60" y="44" font-size="11" fill="#8b87a8">Laravel · Octane · Pennant gates · Pest</text>
    </g>
    <!-- mobile -->
    <g transform="translate(762 382)">
      <rect width="382" height="58" rx="12" fill="#0d0c1e" stroke="#26224a"/>
      <rect x="16" y="15" width="28" height="28" rx="7" fill="#00b4bf" fill-opacity="0.16" stroke="#00b4bf" stroke-opacity="0.6"/>
      <rect x="24" y="19" width="12" height="20" rx="3" fill="none" stroke="#00b4bf" stroke-width="1.6"/>
      <circle cx="30" cy="36" r="1.2" fill="#00b4bf"/>
      <text x="60" y="26" font-size="14" fill="#e8e4ff">apps/mobile</text>
      <text x="60" y="44" font-size="11" fill="#8b87a8">Flutter · server-driven theme · cubits</text>
    </g>
    <!-- infra -->
    <g transform="translate(762 484)">
      <rect width="382" height="58" rx="12" fill="#0d0c1e" stroke="#26224a"/>
      <rect x="16" y="15" width="28" height="28" rx="7" fill="#988cff" fill-opacity="0.18" stroke="#988cff" stroke-opacity="0.6"/>
      <path d="M24 38 l6 -8 l4 5 l5 -9 l5 12" fill="none" stroke="#988cff" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="60" y="26" font-size="14" fill="#e8e4ff">server/ + .github/</text>
      <text x="60" y="44" font-size="11" fill="#8b87a8">Swarm · Traefik · GH Actions · provisioner</text>
    </g>
  </g>

  <!-- labels -->
  <text x="188" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#6f6a96">YOU ANSWER</text>
  <text x="480" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#6f6a96">IT BECOMES</text>
  <text x="953" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#6f6a96">YOU RECEIVE</text>
</svg>
