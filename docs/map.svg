<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="The map — apeiron root branching into index.mjs the factory gate, lib the engines, boilerplate the platform tree, styling souls, ai the agent curriculum, docs the visuals">
  <defs>
    <linearGradient id="m-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #e8e4ff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .path { fill: #c4bcff; font-size: 13.5px; font-weight: 600; }
      .role { fill: #9d97c9; font-size: 12px; }
      .slab { fill: url(#m-fill); stroke: #26224a; }
      .node { opacity: 0; animation: arrive 9s ease-out infinite; animation-delay: calc(var(--i) * .5s); }
      .flow { fill: none; stroke: #00b4bf; stroke-width: 1.4; stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; }
      @keyframes arrive { 0% { opacity: 0; } 2% { opacity: 1; } 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="14" fill="url(#m-fill)" stroke="#26224a"/>

  <!-- the root -->
  <g>
    <rect x="48" y="187" width="200" height="56" rx="11" fill="url(#m-fill)" stroke="#988cff"/>
    <text x="148" y="212" text-anchor="middle" class="mono path">apeiron</text>
    <text x="148" y="230" text-anchor="middle" class="role">the factory · node .</text>
  </g>

  <!-- branches -->
  <path class="flow" d="M248,215 C320,215 330,50 400,50"/>
  <path class="flow" d="M248,215 C320,215 330,116 400,116"/>
  <path class="flow" d="M248,215 C320,215 330,182 400,182"/>
  <path class="flow" d="M248,215 C320,215 330,248 400,248"/>
  <path class="flow" d="M248,215 C320,215 330,314 400,314"/>
  <path class="flow" d="M248,215 C320,215 330,380 400,380"/>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" repeatCount="indefinite" path="M248,215 C320,215 330,50 400,50"/></circle>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M248,215 C320,215 330,116 400,116"/></circle>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M248,215 C320,215 330,182 400,182"/></circle>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite" path="M248,215 C320,215 330,248 400,248"/></circle>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite" path="M248,215 C320,215 330,314 400,314"/></circle>
  <circle r="3" fill="#00b4bf"><animateMotion dur="2.6s" begin="2s" repeatCount="indefinite" path="M248,215 C320,215 330,380 400,380"/></circle>

  <!-- slabs -->
  <g class="node" style="--i:0">
    <rect x="400" y="23" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="56" class="mono path">index.mjs</text>
    <text x="600" y="56" class="role">the factory gate — node . · interactive or --answers for agents</text>
  </g>
  <g class="node" style="--i:1">
    <rect x="400" y="89" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="122" class="mono path">lib/</text>
    <text x="600" y="122" class="role">prompts tui · oklch engine · renderer · rbac generator · builders</text>
  </g>
  <g class="node" style="--i:2">
    <rect x="400" y="155" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="188" class="mono path">boilerplate/</text>
    <text x="600" y="188" class="role">the platform tree — 250+ files, rendered per project</text>
  </g>
  <g class="node" style="--i:3">
    <rect x="400" y="221" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="254" class="mono path">styling/souls/</text>
    <text x="600" y="254" class="role">aurora · blueprint · editorial · neon</text>
  </g>
  <g class="node" style="--i:4">
    <rect x="400" y="287" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="320" class="mono path">ai/</text>
    <text x="600" y="320" class="role">the agent curriculum, shipped into every project</text>
  </g>
  <g class="node" style="--i:5">
    <rect x="400" y="353" width="760" height="54" rx="11" class="slab"/>
    <text x="424" y="386" class="mono path">docs/</text>
    <text x="600" y="386" class="role">the visuals above — apeiron's own generated palette</text>
  </g>
</svg>
