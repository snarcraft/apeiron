<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="The zero-ops checklist — dns and tls, hosting, datastores, caching, storage, email, migrations, observability: all automated, idempotent, narrated on Discord">
  <defs>
    <linearGradient id="c-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #e8e4ff; }
      .lbl { fill: #c4bcff; font-weight: 600; font-size: 14px; }
      .dim { fill: #9d97c9; font-size: 11px; }
      .box { fill: url(#c-fill); stroke: #26224a; }
      .chip { opacity: 0; animation: arrive 9s ease-out infinite; animation-delay: calc(var(--i) * .35s); }
      .tick { fill: none; stroke: #00b4bf; stroke-width: 2.2; stroke-linecap: round;
              stroke-dasharray: 26; stroke-dashoffset: 26;
              animation: draw 9s ease-out infinite; animation-delay: calc(var(--i) * .35s); }
      .halo { fill: none; stroke: #00b4bf; stroke-opacity: .25; stroke-width: 1.2;
              animation: breathe 9s ease-in-out infinite; animation-delay: calc(var(--i) * .35s); }
      @keyframes arrive { 0% { opacity: 0; } 1.5% { opacity: 1; } 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes draw { 0% { stroke-dashoffset: 26; } 4% { stroke-dashoffset: 0; } 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 26; } }
      @keyframes breathe { 0%,100% { stroke-opacity: .15; } 50% { stroke-opacity: .4; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#c-fill)" stroke="#26224a"/>

  <!-- row 1 -->
  <g class="chip" style="--i:0">
    <rect x="30" y="26" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="58" cy="54" r="13"/><circle cx="58" cy="54" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M51,54 L56,60 L66,48"/>
    <text x="82" y="59" class="lbl">dns + tls</text>
    <text x="52" y="96" class="dim">cloudflare records minted · traefik</text>
    <text x="52" y="113" class="dim">terminates tls via dns-01 — no certbot</text>
  </g>
  <g class="chip" style="--i:1">
    <rect x="326" y="26" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="354" cy="54" r="13"/><circle cx="354" cy="54" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M347,54 L352,60 L362,48"/>
    <text x="378" y="59" class="lbl">hosting</text>
    <text x="348" y="96" class="dim">one ec2 per env · keys · security</text>
    <text x="348" y="113" class="dim">groups — idempotent, re-runs reuse</text>
  </g>
  <g class="chip" style="--i:2">
    <rect x="622" y="26" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="650" cy="54" r="13"/><circle cx="650" cy="54" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M643,54 L648,60 L658,48"/>
    <text x="674" y="59" class="lbl">datastores</text>
    <text x="644" y="96" class="dim">postgres · redis · s3 media + cdn</text>
    <text x="644" y="113" class="dim">buckets — least-privilege iam each</text>
  </g>
  <g class="chip" style="--i:3">
    <rect x="918" y="26" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="946" cy="54" r="13"/><circle cx="946" cy="54" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M939,54 L944,60 L954,48"/>
    <text x="970" y="59" class="lbl">caching</text>
    <text x="940" y="96" class="dim">redis cache · sessions · queues —</text>
    <text x="940" y="113" class="dim">auth tag flushes itself on change</text>
  </g>

  <!-- row 2 -->
  <g class="chip" style="--i:4">
    <rect x="30" y="158" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="58" cy="186" r="13"/><circle cx="58" cy="186" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M51,186 L56,192 L66,180"/>
    <text x="82" y="191" class="lbl">storage</text>
    <text x="52" y="228" class="dim">delete a model — its files queue</text>
    <text x="52" y="245" class="dim">for removal · nothing orphans</text>
  </g>
  <g class="chip" style="--i:5">
    <rect x="326" y="158" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="354" cy="186" r="13"/><circle cx="354" cy="186" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M347,186 L352,192 L362,180"/>
    <text x="378" y="191" class="lbl">email</text>
    <text x="348" y="228" class="dim">queued verification + resets ·</text>
    <text x="348" y="245" class="dim">failures broadcast · one var to ses</text>
  </g>
  <g class="chip" style="--i:6">
    <rect x="622" y="158" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="650" cy="186" r="13"/><circle cx="650" cy="186" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M643,186 L648,192 L658,180"/>
    <text x="674" y="191" class="lbl">migrations</text>
    <text x="644" y="228" class="dim">one-off swarm jobs *before* the roll —</text>
    <text x="644" y="245" class="dim">every service boots on the new schema</text>
  </g>
  <g class="chip" style="--i:7">
    <rect x="918" y="158" width="276" height="116" rx="11" class="box"/>
    <circle class="halo" cx="946" cy="186" r="13"/><circle cx="946" cy="186" r="13" fill="none" stroke="#26224a"/>
    <path class="tick" d="M939,186 L944,192 L954,180"/>
    <text x="970" y="191" class="lbl">observability</text>
    <text x="940" y="228" class="dim">loki scrapes all · grafana :3001 ·</text>
    <text x="940" y="245" class="dim">discord narrates — green or red</text>
  </g>
</svg>
