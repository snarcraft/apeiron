<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Classic php reboots the framework for every request; Octane plus Swoole boots once and serves hot from worker memory">
  <defs>
    <linearGradient id="o-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #e8e4ff; }
      .lane-lbl { fill: #c4bcff; font-weight: 600; font-size: 14px; }
      .dim { fill: #9d97c9; font-size: 11px; }
      .verdict { font-size: 12px; font-weight: 600; }
      .track { stroke: #26224a; stroke-width: 2; }
      .hot { stroke: #988cff; stroke-width: 2; stroke-dasharray: 4 6; animation: dash 1s linear infinite; }
      .gate { fill: none; stroke: #9d97c9; stroke-width: 2; stroke-linecap: round; }
      .spin { transform-origin: center; transform-box: fill-box; }
      @keyframes dash { to { stroke-dashoffset: -10; } }
    </style>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#o-fill)" stroke="#26224a"/>

  <!-- lane 1 : classic php -->
  <text x="40" y="86" class="lane-lbl">classic php</text>
  <text x="40" y="104" class="dim">boots per request · php-fpm</text>
  <line x1="420" y1="92" x2="1090" y2="92" class="track"/>

  <g class="spin"><circle cx="560" cy="92" r="14" fill="#15132b" stroke="#26224a"/>
    <path class="gate" d="M560,82 A10,10 0 0 1 570,92"/>
    <animateTransform attributeName="transform" type="rotate" from="0 560 92" to="360 560 92" dur="1s" repeatCount="indefinite"/>
  </g>
  <g class="spin"><circle cx="760" cy="92" r="14" fill="#15132b" stroke="#26224a"/>
    <path class="gate" d="M760,82 A10,10 0 0 1 770,92"/>
    <animateTransform attributeName="transform" type="rotate" from="0 760 92" to="360 760 92" dur="1s" repeatCount="indefinite"/>
  </g>
  <g class="spin"><circle cx="960" cy="92" r="14" fill="#15132b" stroke="#26224a"/>
    <path class="gate" d="M960,82 A10,10 0 0 1 970,92"/>
    <animateTransform attributeName="transform" type="rotate" from="0 960 92" to="360 960 92" dur="1s" repeatCount="indefinite"/>
  </g>
  <text x="560" y="128" text-anchor="middle" class="dim">boot</text>
  <text x="760" y="128" text-anchor="middle" class="dim">boot</text>
  <text x="960" y="128" text-anchor="middle" class="dim">boot</text>
  <circle r="4" fill="#9d97c9">
    <animateMotion dur="5.4s" repeatCount="indefinite" path="M420,92 L1090,92"
      keyPoints="0;0.13;0.13;0.4;0.4;0.67;0.67;1" keyTimes="0;0.12;0.4;0.45;0.7;0.75;0.96;1" calcMode="linear"/>
  </circle>
  <text x="1130" y="96" class="verdict" fill="#9d97c9">cold</text>

  <!-- lane 2 : octane + swoole -->
  <text x="40" y="236" class="lane-lbl">octane + swoole</text>
  <text x="40" y="254" class="dim">boots once · hot in worker memory</text>
  <line x1="420" y1="242" x2="1090" y2="242" class="hot"/>

  <circle cx="470" cy="242" r="14" fill="#15132b" stroke="#00b4bf"/>
  <path d="M463,242 L468,248 L478,236" fill="none" stroke="#00b4bf" stroke-width="2.2" stroke-linecap="round"/>
  <text x="470" y="278" text-anchor="middle" class="dim">boots once</text>
  <text x="760" y="278" text-anchor="middle" class="dim">coroutine i/o serves requests hot</text>

  <circle r="4" fill="#988cff">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M496,242 L1090,242"/>
  </circle>
  <circle r="4" fill="#988cff" opacity=".55">
    <animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M496,242 L1090,242"/>
  </circle>
  <text x="1130" y="246" class="verdict" fill="#00b4bf">blazing</text>
</svg>
