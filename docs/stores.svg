<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Every git tag ships itself to the app store via TestFlight and to Google Play on the internal track — unattended">
  <defs>
    <linearGradient id="s-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15132b"/>
      <stop offset="100%" stop-color="#0d0c1e"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #e8e4ff; }
      .lbl { fill: #c4bcff; font-weight: 600; font-size: 10.5px; letter-spacing: .08em; }
      .dim { fill: #9d97c9; font-size: 11px; }
      .box { fill: url(#s-fill); stroke: #26224a; }
      .flow { fill: none; stroke: #988cff; stroke-width: 1.4; stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; }
      .node { animation: breathe 3.6s ease-in-out infinite; }
      .d1 { animation-delay: .9s; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      @keyframes breathe { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
    </style>
  </defs>

  <rect width="1200" height="230" rx="14" fill="url(#s-fill)" stroke="#26224a"/>

  <!-- the tag -->
  <g class="node">
    <rect x="510" y="24" width="180" height="36" rx="9" class="box" stroke="#988cff"/>
    <text x="600" y="47" text-anchor="middle" class="lbl">GIT TAG · HANDS OFF</text>
  </g>

  <!-- flights to the stores -->
  <path class="flow" d="M540,60 C440,96 340,110 300,128"/>
  <path class="flow" d="M660,60 C760,96 860,110 900,128"/>
  <circle r="3" fill="#988cff">
    <animateMotion dur="1.9s" repeatCount="indefinite" path="M540,60 C440,96 340,110 300,128"/>
  </circle>
  <circle r="3" fill="#00b4bf">
    <animateMotion dur="1.9s" begin="0.9s" repeatCount="indefinite" path="M660,60 C760,96 860,110 900,128"/>
  </circle>

  <!-- app store -->
  <g class="node">
    <rect x="160" y="130" width="290" height="68" rx="11" class="box"/>
    <g transform="translate(188,146) scale(1.5)">
      <path fill="#e8e4ff" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04c-2.04.027-3.91 1.183-4.961 3.014c-2.117 3.675-.546 9.103 1.519 12.09c1.013 1.454 2.208 3.09 3.792 3.039c1.52-.065 2.09-.987 3.935-.987c1.831 0 2.35.987 3.96.948c1.637-.026 2.676-1.48 3.676-2.948c1.156-1.688 1.636-3.325 1.662-3.415c-.039-.013-3.182-1.221-3.22-4.857c-.026-3.04 2.48-4.494 2.597-4.559c-1.429-2.09-3.623-2.324-4.39-2.376c-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83c-1.207.052-2.662.805-3.532 1.818c-.78.896-1.454 2.338-1.273 3.714c1.338.104 2.715-.688 3.559-1.701"/>
    </g>
    <text x="250" y="159" class="lbl">APP STORE</text>
    <text x="250" y="178" class="dim">testflight · signed in ci</text>
  </g>

  <!-- google play -->
  <g class="node d1">
    <rect x="750" y="130" width="290" height="68" rx="11" class="box"/>
    <g transform="translate(778,146) scale(1.5)">
      <path fill="#3ddc84" d="M18.44 5.559q-1.015 1.748-2.028 3.498q-.055-.023-.111-.043a12.1 12.1 0 0 0-8.68.033C7.537 8.897 5.868 6.026 5.6 5.56a1 1 0 0 0-.141-.19a1.104 1.104 0 0 0-1.768 1.298c1.947 3.37-.096-.216 1.948 3.36c.017.03-.495.263-1.393 1.017C2.9 12.176.452 14.772 0 18.99h24a11.7 11.7 0 0 0-.746-3.068a12.1 12.1 0 0 0-2.74-4.184a12 12 0 0 0-2.131-1.687c.66-1.122 1.312-2.256 1.965-3.385a1.11 1.11 0 0 0-.008-1.12a1.1 1.1 0 0 0-.852-.532c-.522-.054-.939.313-1.049.545m-.04 8.46c.395.593.324 1.331-.156 1.65c-.48.32-1.188.1-1.582-.493s-.324-1.33.156-1.65c.473-.316 1.182-.11 1.582.494m-11.193-.492c.48.32.55 1.058.156 1.65c-.394.593-1.103.815-1.584.495c-.48-.32-.55-1.058-.156-1.65c.4-.603 1.109-.811 1.584-.495"/>
    </g>
    <text x="840" y="159" class="lbl">GOOGLE PLAY</text>
    <text x="840" y="178" class="dim">internal track · unattended</text>
  </g>
</svg>
